[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iricity-frontier-shared"
version = "0.3.0"
description = "Python implementation of the Frontier State Protocol primitives: RFC 8785 canonical JSON, SHA-256 hashing, ed25519 identity as did:key, signed envelopes and signed receipt chains, verified against the published conformance vectors."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Iricity Leadership Private Limited" }]
keywords = ["canonical-json", "rfc8785", "ed25519", "did-key", "receipts", "provenance", "space"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security :: Cryptography",
  "Topic :: Scientific/Engineering",
]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
frontier-shared-conformance = "frontier_shared.conformance:main"

[project.urls]
Homepage = "https://github.com/iricity/iricity-frontier-shared-py"
Vectors = "https://github.com/iricity/iricity-frontier-shared"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frontier_shared = ["vectors/v2/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
