name: Publish

# Publishes iricity-frontier-shared to PyPI through trusted publishing (OIDC).
# Requires a Trusted Publisher on PyPI for this repository, workflow "publish.yml",
# environment "pypi", and a GitHub environment named "pypi" with a required reviewer.
# See docs/RELEASE_PLAYBOOK.md in the JavaScript repository.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install -e .[test]
      - run: pytest -q
      - run: frontier-shared-conformance
      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          version="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
